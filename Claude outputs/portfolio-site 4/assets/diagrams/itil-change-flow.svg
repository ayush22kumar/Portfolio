<svg viewBox="0 0 900 165" xmlns="http://www.w3.org/2000/svg" font-family="Montserrat, sans-serif">
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B4A57" />
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="165" fill="#FFFFFF" />

  <!-- Stage boxes -->
  <!-- 1 -->
  <rect x="20" y="80" width="140" height="60" fill="#F1F2ED" stroke="#C9CCC2" />
  <text x="90" y="105" text-anchor="middle" font-size="13" fill="#142433" font-weight="600">Request</text>
  <text x="90" y="122" text-anchor="middle" font-size="11" fill="#3B4A57">submitted</text>

  <!-- 2 -->
  <rect x="195" y="70" width="150" height="80" fill="#F1F2ED" stroke="#7A5420" stroke-width="1.5" />
  <text x="270" y="98" text-anchor="middle" font-size="13" fill="#142433" font-weight="600">Automated intake</text>
  <text x="270" y="116" text-anchor="middle" font-size="11" fill="#3B4A57">Power Automate</text>
  <text x="270" y="131" text-anchor="middle" font-size="11" fill="#3B4A57">+ Power Apps</text>

  <!-- 3 -->
  <rect x="380" y="80" width="140" height="60" fill="#F1F2ED" stroke="#C9CCC2" />
  <text x="450" y="105" text-anchor="middle" font-size="13" fill="#142433" font-weight="600">Triage &amp;</text>
  <text x="450" y="122" text-anchor="middle" font-size="11" fill="#3B4A57">prioritisation</text>

  <!-- 4 -->
  <rect x="555" y="80" width="140" height="60" fill="#F1F2ED" stroke="#C9CCC2" />
  <text x="625" y="105" text-anchor="middle" font-size="13" fill="#142433" font-weight="600">Director</text>
  <text x="625" y="122" text-anchor="middle" font-size="11" fill="#3B4A57">approval</text>

  <!-- 5 -->
  <rect x="730" y="80" width="150" height="60" fill="#F1F2ED" stroke="#C9CCC2" />
  <text x="805" y="105" text-anchor="middle" font-size="13" fill="#142433" font-weight="600">Build &amp;</text>
  <text x="805" y="122" text-anchor="middle" font-size="11" fill="#3B4A57">production release</text>

  <!-- Arrows -->
  <line x1="160" y1="110" x2="193" y2="110" stroke="#3B4A57" stroke-width="1.5" marker-end="url(#arrow1)" />
  <line x1="345" y1="110" x2="378" y2="110" stroke="#3B4A57" stroke-width="1.5" marker-end="url(#arrow1)" />
  <line x1="520" y1="110" x2="553" y2="110" stroke="#3B4A57" stroke-width="1.5" marker-end="url(#arrow1)" />
  <line x1="695" y1="110" x2="728" y2="110" stroke="#3B4A57" stroke-width="1.5" marker-end="url(#arrow1)" />

  <!-- Annotation for automation zone -->
  <text x="270" y="45" text-anchor="middle" font-size="11" fill="#7A5420" font-family="Montserrat, sans-serif">manual step removed</text>
  <line x1="195" y1="55" x2="345" y2="55" stroke="#7A5420" stroke-width="1" stroke-dasharray="3,3" />
</svg>
