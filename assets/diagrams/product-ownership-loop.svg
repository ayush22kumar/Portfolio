<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="Montserrat, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="700" height="430" fill="#FFFFFF" />

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B4A57" />
    </marker>
  </defs>

  <!-- Circle positions (cycle of 5) -->
  <!-- Discovery: top -->
  <circle cx="350" cy="70" r="55" fill="#F1F2ED" stroke="#7A5420" stroke-width="1.5" />
  <text x="350" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#142433">Discovery &amp;</text>
  <text x="350" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#142433">end-user interviews</text>

  <!-- Requirements: right-top -->
  <circle cx="560" cy="190" r="55" fill="#F1F2ED" stroke="#C9CCC2" />
  <text x="560" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#142433">Requirements &amp;</text>
  <text x="560" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#142433">acceptance criteria</text>

  <!-- Backlog: right-bottom -->
  <circle cx="480" cy="370" r="55" fill="#F1F2ED" stroke="#C9CCC2" />
  <text x="480" y="366" text-anchor="middle" font-size="13" font-weight="600" fill="#142433">Backlog</text>
  <text x="480" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#142433">prioritisation</text>

  <!-- Delivery + UAT: left-bottom -->
  <circle cx="220" cy="370" r="55" fill="#F1F2ED" stroke="#C9CCC2" />
  <text x="220" y="366" text-anchor="middle" font-size="13" font-weight="600" fill="#142433">Delivery &amp;</text>
  <text x="220" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#142433">UAT sign-off</text>

  <!-- Feedback: left-top -->
  <circle cx="140" cy="190" r="55" fill="#F1F2ED" stroke="#C9CCC2" />
  <text x="140" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#142433">Adoption &amp;</text>
  <text x="140" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#142433">feedback</text>

  <!-- connecting arrows around the loop -->
  <path d="M 400 95 Q 480 120 525 150" fill="none" stroke="#3B4A57" stroke-width="1.5" marker-end="url(#arrow2)" />
  <path d="M 545 240 Q 530 300 520 325" fill="none" stroke="#3B4A57" stroke-width="1.5" marker-end="url(#arrow2)" />
  <path d="M 425 385 Q 350 400 275 385" fill="none" stroke="#3B4A57" stroke-width="1.5" marker-end="url(#arrow2)" />
  <path d="M 180 325 Q 165 300 155 240" fill="none" stroke="#3B4A57" stroke-width="1.5" marker-end="url(#arrow2)" />
  <path d="M 175 150 Q 220 120 300 95" fill="none" stroke="#3B4A57" stroke-width="1.5" marker-end="url(#arrow2)" />
</svg>
